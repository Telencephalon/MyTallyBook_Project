server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:7631}

spring:
  application:
    name: account-book-server

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

app:
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    session-endpoint: https://api.weixin.qq.com/sns/jscode2session
    connect-timeout: 3s
    read-timeout: 5s
  auth:
    bootstrap-key: ${APP_BOOTSTRAP_KEY:}
    token-pepper: ${APP_TOKEN_PEPPER:}
    session-ttl: 30d
    token-bytes: 32
